name: "website"
on:
  push:
    branches: ["develop","release"] 
    paths: ["website/**"]

jobs:
  build-deploy-dev:
    runs-on: ubuntu-latest
    environment: proyectoweb
    if: github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - uses: aws-actions/setup-sam@v1
      - uses: actions/configure-aws-credentials@v1
        with:
           aws-access-key-id: ${{ secrets.AWS_ACCES_KEY_ID_DEV }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
           aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_DEV }}
           aws-region: ${{ secrets.REGION }}
      - run: awk -v var1="${{ vars.DEV_EDAD }}" -v var2="${{ vars.DEV_ANACI }}" '{ gsub(/edad/,var1); gsub(/anaci/,var2); print }' lambda.yaml > lambda_new.yaml && mv lambda_new.yaml lambda.yaml 
      